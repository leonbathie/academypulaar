set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# Redirect IP and old domains to goomufulo.com
server {
    listen 80;
    listen 443 ssl;
    server_name 173.249.2.195 goomunfulawidto.serveblog.net;

    ssl_certificate /etc/letsencrypt/live/goomufulo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goomufulo.com/privkey.pem;

    return 301 https://goomufulo.com$request_uri;
}

# Redirect www to non-www
server {
    listen 80;
    listen 443 ssl;
    server_name www.goomufulo.com;

    ssl_certificate /etc/letsencrypt/live/goomufulo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goomufulo.com/privkey.pem;

    return 301 https://goomufulo.com$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name goomufulo.com;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://goomufulo.com$request_uri;
    }
}

# Main site
server {
    listen 443 ssl;
    server_name goomufulo.com;

    ssl_certificate /etc/letsencrypt/live/goomufulo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goomufulo.com/privkey.pem;

    # Disable SSL renegotiation (fixes ERR_CONNECTION_ABORTED on POST)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 100M;

    # Enable gzip (fixes ERR_CONTENT_LENGTH_MISMATCH)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/academypulaar/academie-react/dist;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy_revalidate, max-age=0";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location /api {
        # General API rate limit
        limit_req zone=api_zone burst=20 nodelay;
        client_max_body_size 100M;
        client_body_timeout 900s;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Strict rate limiting on auth (login/register)
    location /api/auth {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API routes - strict rate limit
    location ~ ^/api/(users|members|books|content|news|questions|dictionary) {
        limit_req zone=admin_zone burst=10 nodelay;
        client_max_body_size 100M;
        client_body_timeout 900s;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /uploads {
        alias /var/www/academypulaar/backend/uploads;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;

        # Block execution of scripts in uploads
        location ~* \.(php|jsp|asp|sh|cgi|py|pl)$ {
            deny all;
        }
    }

    # Partage social : /share/word/:id et /share/word/:id/image.png
    # Doit etre route vers le backend pour servir les balises Open Graph
    # consommees par les bots FB/WhatsApp/Twitter/LinkedIn.
    location /share {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        # Permet a Cloudflare/navigateurs de cacher l'image
        proxy_cache_bypass 0;
    }
}
