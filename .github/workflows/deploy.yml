name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          cd /var/www/academypulaar
          git pull origin main
          
          # Backend
          cd backend
          npm install
          pm2 restart academypulaar-api || pm2 start server.js --name academypulaar-api
          
          # Frontend
          cd ../academie-react
          npm install
          npm run build
          
          # Restart Nginx
          systemctl reload nginx
          
          echo "✅ Déploiement terminé!"
