name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Setup sudo for gha (one-time)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          PM2=/usr/lib/node_modules/pm2/bin/pm2
          if sudo -n true 2>/dev/null; then
            echo "sudo already configured"
          else
            echo "Granting gha passwordless sudo via PM2..."
            printf '#!/bin/bash\necho "gha ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/gha-deploy\nchmod 440 /etc/sudoers.d/gha-deploy\nvisudo -cf /etc/sudoers.d/gha-deploy && echo "sudoers OK" || rm -f /etc/sudoers.d/gha-deploy\n' > /tmp/setup-sudoers.sh
            chmod +x /tmp/setup-sudoers.sh
            sudo $PM2 delete sudoers-fix 2>/dev/null || true
            sudo $PM2 start /tmp/setup-sudoers.sh --name sudoers-fix --interpreter bash --no-autorestart
            sleep 5
            sudo $PM2 logs sudoers-fix --lines 20 --nostream 2>&1 || true
            sudo $PM2 delete sudoers-fix 2>&1 || true
          fi

      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          echo "Current user: $(whoami)"
          echo "File owner: $(stat -c '%U' backend/routes/books.js)"
          sudo chown -R $(whoami):$(whoami) /var/www/academypulaar
          sudo git config --global --add safe.directory /var/www/academypulaar
          git fetch origin main
          git reset --hard origin/main
          echo "Deployed commit: $(git rev-parse HEAD)"
          echo "Last commit message: $(git log -1 --pretty=%s)"
          echo "=== Verify books.js updated ==="
          grep -n 'titre en fran' backend/routes/books.js || echo "WARNING: books.js NOT updated!"
          head -5 backend/routes/books.js

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          PM2=/usr/lib/node_modules/pm2/bin/pm2
          echo "Stopping existing PM2 processes..."
          sudo $PM2 delete academypulaar-api 2>/dev/null || true
          sudo $PM2 delete all 2>/dev/null || true
          echo "Starting fresh from $(pwd)..."
          sudo $PM2 start server.js --name academypulaar-api --cwd /var/www/academypulaar/backend
          sleep 3
          sudo $PM2 list
          sudo $PM2 logs academypulaar-api --lines 10 --nostream 2>&1 || true

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        timeout-minutes: 2
        run: |
          PM2=/usr/lib/node_modules/pm2/bin/pm2
          if sudo -n true 2>/dev/null; then
            echo "Using direct sudo..."
            sudo cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar
            sudo ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
            sudo sed -i '/http {/a\    client_max_body_size 100M;' /etc/nginx/nginx.conf
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Nginx configured via sudo"
          else
            echo "Sudo not available, using PM2 fallback..."
            printf '#!/bin/bash\nset -e\ncp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar\nln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar\nrm -f /etc/nginx/sites-enabled/default\nsed -i "/client_max_body_size/d" /etc/nginx/nginx.conf\nsed -i "/http {/a\\    client_max_body_size 100M;" /etc/nginx/nginx.conf\nnginx -t && systemctl reload nginx\necho "Nginx configured via PM2"\n' > /tmp/fix-nginx.sh
            chmod +x /tmp/fix-nginx.sh
            sudo $PM2 delete nginx-fix 2>/dev/null || true
            sudo $PM2 start /tmp/fix-nginx.sh --name nginx-fix --interpreter bash --no-autorestart
            sleep 10
            sudo $PM2 logs nginx-fix --lines 50 --nostream 2>&1 || true
            sudo $PM2 delete nginx-fix 2>&1 || true
          fi

      - name: Verify deployment
        run: |
          sleep 3
          echo "=== Frontend ==="
          curl -s -o /dev/null -w '%{http_code}' http://localhost && echo " Frontend: OK" || echo " Frontend: FAIL"
          echo "=== API Health ==="
          curl -s http://localhost:5000/api/health || echo "API Health: FAIL"
          echo ""
          echo "=== API Books POST validation test ==="
          curl -s -X POST http://localhost:5000/api/books -H 'Content-Type: application/json' -d '{}' || true
          echo ""
          echo "=== Deployed commit ==="
          cd /var/www/academypulaar && git rev-parse HEAD
          echo "Deployment complete!"
