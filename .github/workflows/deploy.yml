name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git pull origin main

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          sudo /usr/lib/node_modules/pm2/bin/pm2 restart academypulaar-api || sudo /usr/lib/node_modules/pm2/bin/pm2 start server.js --name academypulaar-api

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        continue-on-error: true
        run: |
          # Create fix script with LF endings (avoids CRLF issues from Windows)
          cat > /tmp/fix-nginx.sh << 'ENDSCRIPT'
          #!/bin/bash
          set -e
          echo "Fixing Nginx config..."
          
          # Add client_max_body_size globally
          sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
          sed -i '/http {/a\    client_max_body_size 100M;' /etc/nginx/nginx.conf
          
          # Copy site config
          cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-enabled/default 2>/dev/null || true
          cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar 2>/dev/null || true
          ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar 2>/dev/null || true
          
          nginx -t && systemctl reload nginx
          echo "Nginx fixed successfully!"
          ENDSCRIPT
          chmod +x /tmp/fix-nginx.sh
          
          # Method 1: Direct sudo bash
          if sudo bash /tmp/fix-nginx.sh 2>&1; then
            echo "==> Method 1 (sudo bash) worked!"
          else
            echo "==> Method 1 failed, trying Method 2 (PM2)..."
            # Method 2: Run via PM2 with sudo (gha has sudo access to PM2)
            sudo /usr/lib/node_modules/pm2/bin/pm2 start /tmp/fix-nginx.sh --name nginx-fix --interpreter bash --no-autorestart 2>&1 || true
            sleep 5
            sudo /usr/lib/node_modules/pm2/bin/pm2 logs nginx-fix --lines 30 2>&1 || true
            sudo /usr/lib/node_modules/pm2/bin/pm2 delete nginx-fix 2>&1 || true
          fi

      - name: Reload Nginx
        continue-on-error: true
        run: sudo systemctl reload nginx

      - name: Verify deployment
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
          echo ""
          echo "Deployment complete!"
