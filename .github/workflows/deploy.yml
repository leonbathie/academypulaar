name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: System prerequisites
        run: |
          echo "=== System info ==="
          uname -a
          echo "User: $(whoami)"

          echo "=== Remove stale nodesource list if present ==="
          sudo rm -f /etc/apt/sources.list.d/nodesource.list 2>/dev/null || true

          echo "=== Install base packages ==="
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl git nginx postgresql postgresql-contrib lsof openssl certbot python3-certbot-nginx || true

          echo "=== Ensure Node.js 20 ==="
          if ! command -v node &>/dev/null || [[ $(node -v | cut -d. -f1 | tr -d v) -lt 20 ]]; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y -qq nodejs
          fi
          echo "Node: $(node -v) | NPM: $(npm -v)"

          echo "=== Install PM2 globally ==="
          sudo npm install -g pm2 || true
          echo "PM2: $(pm2 -v || echo 'not installed')"

      - name: Setup project directory
        run: |
          REPO_DIR=/var/www/academypulaar
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "=== Cloning repo for first time ==="
            sudo mkdir -p /var/www
            sudo chown -R $(whoami):$(whoami) /var/www
            git clone https://github.com/leonbathie/academypulaar.git $REPO_DIR
          fi
          sudo chown -R $(whoami):$(whoami) $REPO_DIR
          git config --global --add safe.directory $REPO_DIR 2>/dev/null || true

      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git fetch origin main
          git reset --hard origin/main
          echo "Deployed commit: $(git rev-parse HEAD)"
          echo "Last commit message: $(git log -1 --pretty=%s)"

      - name: Setup PostgreSQL
        run: |
          echo "=== Ensure PostgreSQL is running ==="
          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          echo "=== Create database and user if needed ==="
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='academypulaar'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE USER academypulaar WITH PASSWORD '${{ secrets.DB_PASSWORD }}';"

          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='academypulaar'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE DATABASE academypulaar OWNER academypulaar;"

          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE academypulaar TO academypulaar;" 2>/dev/null || true
          sudo -u postgres psql -d academypulaar -c "GRANT ALL ON SCHEMA public TO academypulaar;" 2>/dev/null || true
          sudo -u postgres psql -d academypulaar -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO academypulaar;" 2>/dev/null || true

          echo "=== Create backend .env if missing ==="
          ENV_FILE=/var/www/academypulaar/backend/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "DATABASE_URL=postgresql://academypulaar:${{ secrets.DB_PASSWORD }}@localhost:5432/academypulaar" > $ENV_FILE
            echo "DATABASE_SSL=false" >> $ENV_FILE
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $ENV_FILE
            echo "PORT=5000" >> $ENV_FILE
            echo "NODE_ENV=production" >> $ENV_FILE
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $ENV_FILE
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $ENV_FILE
            echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $ENV_FILE
            echo ".env created"
          else
            echo ".env already exists"
            # Ensure GOOGLE_CLIENT_ID is present
            grep -q GOOGLE_CLIENT_ID $ENV_FILE || echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $ENV_FILE
            grep -q SMTP_USER $ENV_FILE || echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> $ENV_FILE
            grep -q SMTP_PASSWORD $ENV_FILE || echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $ENV_FILE
          fi

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Fix uploads permissions
        run: |
          echo "=== Fix uploads permissions ==="
          sudo mkdir -p /var/www/academypulaar/backend/uploads/books
          sudo mkdir -p /var/www/academypulaar/backend/uploads/hero
          sudo chown -R gha:gha /var/www/academypulaar/backend/uploads
          sudo chmod -R 777 /var/www/academypulaar/backend/uploads
          echo "Permissions after fix:"
          ls -la /var/www/academypulaar/backend/uploads/
          ls -la /var/www/academypulaar/backend/uploads/books/
          echo "Write test:"
          sudo -u gha touch /var/www/academypulaar/backend/uploads/.write-test && echo "OK" && rm -f /var/www/academypulaar/backend/uploads/.write-test || echo "FAILED"

      - name: Create fix-uploads script
        run: |
          sudo tee /usr/local/bin/fix-academypulaar-uploads.sh > /dev/null << 'FIXSCRIPT'
          #!/bin/bash
          mkdir -p /var/www/academypulaar/backend/uploads/books
          mkdir -p /var/www/academypulaar/backend/uploads/hero
          chown -R gha:gha /var/www/academypulaar/backend/uploads
          chmod -R 777 /var/www/academypulaar/backend/uploads
          FIXSCRIPT
          sudo chmod +x /usr/local/bin/fix-academypulaar-uploads.sh

      - name: Restart backend (systemd)
        run: |
          echo "=== Create systemd service for backend ==="
          printf '%s\n' \
            '[Unit]' \
            'Description=GoomuFuloWidto API Backend' \
            'After=network.target postgresql.service' \
            '' \
            '[Service]' \
            'Type=simple' \
            'User=gha' \
            'WorkingDirectory=/var/www/academypulaar/backend' \
            'ExecStartPre=+/usr/local/bin/fix-academypulaar-uploads.sh' \
            'ExecStart=/usr/bin/node server.js' \
            'Restart=always' \
            'RestartSec=5' \
            'Environment=NODE_ENV=production' \
            'Environment=PORT=5000' \
            'Environment=DATABASE_URL=postgresql://academypulaar:${{ secrets.DB_PASSWORD }}@localhost:5432/academypulaar' \
            'Environment=DATABASE_SSL=false' \
            'Environment=JWT_SECRET=${{ secrets.JWT_SECRET }}' \
            'Environment=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' \
            'Environment=SMTP_USER=${{ secrets.SMTP_USER }}' \
            'Environment=SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}' \
            '' \
            '[Install]' \
            'WantedBy=multi-user.target' \
            | sudo tee /etc/systemd/system/academypulaar-api.service > /dev/null

          echo "=== Verify service file ==="
          cat /etc/systemd/system/academypulaar-api.service

          echo "=== Reload systemd ==="
          sudo systemctl daemon-reload

          echo "=== Kill anything on port 5000 ==="
          sudo lsof -ti:5000 | xargs -r sudo kill -9 || true
          sleep 2

          echo "=== Stop old PM2 if running ==="
          pm2 kill 2>/dev/null || true
          sudo pm2 kill 2>/dev/null || true

          echo "=== Enable and start the service ==="
          sudo systemctl enable academypulaar-api
          sudo systemctl restart academypulaar-api
          sleep 3

          echo "=== Service status ==="
          sudo systemctl status academypulaar-api --no-pager || true

          echo "=== Service logs ==="
          sudo journalctl -u academypulaar-api --no-pager -n 20 || true

          echo "=== Verify port 5000 ==="
          sudo lsof -i:5000 || echo "CRITICAL: Nothing listening on port 5000!"

          echo "=== Direct API test ==="
          curl -s http://localhost:5000/api/health || echo "API Health: FAIL"

          echo "=== Final uploads permission check ==="
          ls -la /var/www/academypulaar/backend/uploads/
          sudo -u gha touch /var/www/academypulaar/backend/uploads/.final-test && echo "Final write: OK" && rm -f /var/www/academypulaar/backend/uploads/.final-test || echo "Final write: FAILED"

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env.production
          npm run build
          rm -f .env.production

      - name: Setup SSL certificate
        run: |
          echo "=== Check SSL certificate ==="
          CERT_FILE="/etc/letsencrypt/live/goomufulo.com/fullchain.pem"
          NEED_CERT=false

          if [ ! -f "$CERT_FILE" ]; then
            NEED_CERT=true
            echo "No certificate found"
          elif openssl x509 -in "$CERT_FILE" -noout -issuer 2>/dev/null | grep -q "Let's Encrypt\|R3\|R10\|R11\|E5\|E6"; then
            echo "Valid Let's Encrypt certificate found"
            sudo certbot renew --quiet 2>/dev/null || true
          else
            echo "Self-signed certificate detected, will try to replace with Let's Encrypt"
            NEED_CERT=true
          fi

          if [ "$NEED_CERT" = true ]; then
            echo "=== Obtaining Let's Encrypt certificate ==="
            sudo systemctl stop nginx 2>/dev/null || true

            sudo certbot certonly --standalone \
              -d goomufulo.com -d www.goomufulo.com \
              --non-interactive --agree-tos \
              --email contact@goomufulo.com 2>&1 || {
              echo "::warning::Certbot failed (likely rate limit). Checking if any cert exists..."
              if [ -f "$CERT_FILE" ]; then
                echo "Existing certificate found, continuing deploy."
              else
                echo "::warning::No cert available. Creating self-signed fallback (OK behind Cloudflare)."
                sudo mkdir -p /etc/letsencrypt/live/goomufulo.com
                sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                  -keyout /etc/letsencrypt/live/goomufulo.com/privkey.pem \
                  -out /etc/letsencrypt/live/goomufulo.com/fullchain.pem \
                  -subj "/C=FR/ST=IDF/L=Paris/O=GoomuFulo/CN=goomufulo.com"
                echo "Self-signed cert created. Certbot will replace it on next deploy."
              fi
            }
          fi

          # Enable auto-renewal
          sudo systemctl enable certbot.timer 2>/dev/null || true

      - name: Update Nginx config
        run: |
          echo "=== Copy Nginx config ==="
          sudo cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar
          sudo ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar
          sudo rm -f /etc/nginx/sites-enabled/default

          echo "=== Set client_max_body_size in nginx.conf ==="
          sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
          sudo sed -i '/http {/a\    client_max_body_size 100M;' /etc/nginx/nginx.conf

          echo "=== Test and reload Nginx ==="
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl reload nginx || sudo systemctl start nginx
          echo "Nginx configured OK"

      - name: Verify deployment
        run: |
          sleep 3
          echo "=== systemd service status ==="
          sudo systemctl is-active academypulaar-api && echo "Backend service: RUNNING" || echo "Backend service: NOT RUNNING"

          echo "=== Port 5000 check ==="
          sudo lsof -i:5000 || echo "CRITICAL: port 5000 not listening"

          echo "=== API Health (direct) ==="
          curl -s http://localhost:5000/api/health && echo "" || echo "API direct: FAIL"

          echo "=== API via Nginx ==="
          curl -sk https://localhost/api/health && echo "" || echo "API via Nginx: FAIL"

          echo "=== Frontend ==="
          HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://goomufulo.com)
          echo "goomufulo.com HTTPS: $HTTP_CODE"

          echo "=== Deployed commit ==="
          cd /var/www/academypulaar && git rev-parse HEAD
          echo "=== Deployment complete! ==="
