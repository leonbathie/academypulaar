name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git pull origin main

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          sudo /usr/lib/node_modules/pm2/bin/pm2 restart academypulaar-api || sudo /usr/lib/node_modules/pm2/bin/pm2 start server.js --name academypulaar-api

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        run: |
          # Find existing nginx config for this site
          NGINX_CONF=""
          for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/nginx/sites-available/*; do
            if [ -f "$f" ] && grep -q "academypulaar\|173.249.2.195\|goomunfulawidto" "$f" 2>/dev/null; then
              NGINX_CONF="$f"
              break
            fi
          done
          
          if [ -z "$NGINX_CONF" ]; then
            # No existing config found, use sites-available
            NGINX_CONF="/etc/nginx/sites-available/academypulaar"
          fi
          
          echo "Updating Nginx config at: $NGINX_CONF"
          sudo cp /var/www/academypulaar/nginx-academypulaar.conf "$NGINX_CONF"
          
          # Ensure symlink in sites-enabled if using sites-available
          if echo "$NGINX_CONF" | grep -q "sites-available"; then
            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/$(basename "$NGINX_CONF")
          fi
          
          # Also ensure client_max_body_size is set globally as fallback
          if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
            sudo sed -i '/http {/a \\tclient_max_body_size 100M;' /etc/nginx/nginx.conf
          fi
          
          sudo nginx -t

      - name: Reload Nginx
        run: sudo systemctl reload nginx

      - name: Verify deployment
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
          echo ""
          echo "Deployment complete!"
