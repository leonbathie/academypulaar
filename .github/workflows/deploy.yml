name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: System prerequisites
        run: |
          echo "=== System info ==="
          uname -a
          echo "User: $(whoami)"

          echo "=== Install base packages ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl git nginx postgresql postgresql-contrib lsof openssl certbot python3-certbot-nginx

          echo "=== Ensure Node.js 20 ==="
          if ! command -v node &>/dev/null || [[ $(node -v | cut -d. -f1 | tr -d v) -lt 20 ]]; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y -qq nodejs
          fi
          echo "Node: $(node -v) | NPM: $(npm -v)"

          echo "=== Install PM2 globally ==="
          sudo npm install -g pm2 || true
          echo "PM2: $(pm2 -v)"

      - name: Setup project directory
        run: |
          REPO_DIR=/var/www/academypulaar
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "=== Cloning repo for first time ==="
            sudo mkdir -p /var/www
            sudo chown -R $(whoami):$(whoami) /var/www
            git clone https://github.com/leonbathie/academypulaar.git $REPO_DIR
          fi
          sudo chown -R $(whoami):$(whoami) $REPO_DIR
          git config --global --add safe.directory $REPO_DIR 2>/dev/null || true

      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git fetch origin main
          git reset --hard origin/main
          echo "Deployed commit: $(git rev-parse HEAD)"
          echo "Last commit message: $(git log -1 --pretty=%s)"

      - name: Setup PostgreSQL
        run: |
          echo "=== Ensure PostgreSQL is running ==="
          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          echo "=== Create database and user if needed ==="
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='academypulaar'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE USER academypulaar WITH PASSWORD 'academypulaar2024';"

          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='academypulaar'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE DATABASE academypulaar OWNER academypulaar;"

          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE academypulaar TO academypulaar;" 2>/dev/null || true
          sudo -u postgres psql -d academypulaar -c "GRANT ALL ON SCHEMA public TO academypulaar;" 2>/dev/null || true
          sudo -u postgres psql -d academypulaar -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO academypulaar;" 2>/dev/null || true

          echo "=== Create backend .env if missing ==="
          ENV_FILE=/var/www/academypulaar/backend/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "DATABASE_URL=postgresql://academypulaar:academypulaar2024@localhost:5432/academypulaar" > $ENV_FILE
            echo "DATABASE_SSL=false" >> $ENV_FILE
            echo "JWT_SECRET=goomufulowidto-secret-key-2024" >> $ENV_FILE
            echo "PORT=5000" >> $ENV_FILE
            echo "NODE_ENV=production" >> $ENV_FILE
            echo ".env created"
          else
            echo ".env already exists"
          fi

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Create uploads directory
        run: |
          mkdir -p /var/www/academypulaar/backend/uploads
          chmod 755 /var/www/academypulaar/backend/uploads

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          echo "=== Kill existing processes on port 5000 ==="
          sudo lsof -ti:5000 | xargs -r sudo kill -9 || true
          sleep 2

          echo "=== Stop existing PM2 instances ==="
          pm2 kill 2>/dev/null || true
          sudo pm2 kill 2>/dev/null || true
          sleep 1

          echo "=== Verify port 5000 is free ==="
          sudo lsof -i:5000 || echo "Port 5000 is free - OK"

          echo "=== Check .env exists ==="
          cat /var/www/academypulaar/backend/.env || echo "WARNING: .env missing!"

          echo "=== Test node can start server ==="
          cd /var/www/academypulaar/backend
          timeout 5 node -e "require('./database'); console.log('DB module OK')" 2>&1 || echo "DB module test done"

          echo "=== Starting fresh PM2 process ==="
          pm2 start server.js --name academypulaar-api --cwd /var/www/academypulaar/backend --env production
          sleep 5
          pm2 list

          echo "=== PM2 logs (check for errors) ==="
          pm2 logs academypulaar-api --lines 30 --nostream 2>&1 || true

          echo "=== Verify port 5000 ==="
          sudo lsof -i:5000 || echo "CRITICAL: Nothing listening on port 5000!"

          echo "=== Direct API test ==="
          curl -s http://localhost:5000/api/health || echo "API Health: FAIL"

          echo "=== Save PM2 and setup startup ==="
          pm2 save
          STARTUP_CMD=$(pm2 startup systemd -u $(whoami) --hp $HOME 2>&1 | grep 'sudo' | head -1)
          if [ -n "$STARTUP_CMD" ]; then
            echo "Running: $STARTUP_CMD"
            eval $STARTUP_CMD
          fi

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Setup SSL certificate
        run: |
          echo "=== Generate self-signed certificate (fallback) ==="
          if [ ! -f /etc/ssl/certs/nginx-selfsigned.crt ]; then
            sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout /etc/ssl/private/nginx-selfsigned.key \
              -out /etc/ssl/certs/nginx-selfsigned.crt \
              -subj "/C=FR/ST=IDF/L=Paris/O=GoomuFulo/CN=goomufulo.com"
            echo "Self-signed certificate created"
          else
            echo "Self-signed certificate already exists"
          fi

      - name: Update Nginx config
        run: |
          echo "=== Copy Nginx config ==="
          sudo cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar
          sudo ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar
          sudo rm -f /etc/nginx/sites-enabled/default

          echo "=== Set client_max_body_size in nginx.conf ==="
          sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
          sudo sed -i '/http {/a\    client_max_body_size 100M;' /etc/nginx/nginx.conf

          echo "=== Test and reload Nginx ==="
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl reload nginx || sudo systemctl start nginx
          echo "Nginx configured OK"

      - name: Setup Let's Encrypt SSL
        continue-on-error: true
        run: |
          echo "=== Attempting Let's Encrypt certificate ==="
          sudo certbot --nginx -d goomufulo.com -d www.goomufulo.com --non-interactive --agree-tos --email contact@goomufulo.com --redirect 2>&1 || echo "Certbot failed (DNS may not be ready yet). Using self-signed cert."

          echo "=== Setup auto-renewal ==="
          sudo systemctl enable certbot.timer 2>/dev/null || true

      - name: Verify deployment
        run: |
          sleep 3
          echo "=== PM2 status ==="
          pm2 list

          echo "=== Port 5000 check ==="
          sudo lsof -i:5000 || echo "CRITICAL: port 5000 not listening"

          echo "=== API Health (direct) ==="
          curl -s http://localhost:5000/api/health && echo "" || echo "API direct: FAIL"

          echo "=== Frontend ==="
          HTTP_CODE=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost)
          echo "Frontend HTTP: $HTTP_CODE"

          echo "=== API via Nginx ==="
          curl -sk http://localhost/api/health && echo "" || echo "API via Nginx: FAIL"

          echo "=== External access test ==="
          curl -sk -o /dev/null -w '%{http_code}' https://goomufulo.com && echo " goomufulo.com: OK" || echo " goomufulo.com: pending"

          echo "=== Deployed commit ==="
          cd /var/www/academypulaar && git rev-parse HEAD
          echo "=== Deployment complete! ==="
