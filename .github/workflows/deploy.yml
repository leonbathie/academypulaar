name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git pull origin main

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          sudo /usr/lib/node_modules/pm2/bin/pm2 restart academypulaar-api || sudo /usr/lib/node_modules/pm2/bin/pm2 start server.js --name academypulaar-api

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        run: |
          # Ensure client_max_body_size is in nginx.conf globally (most reliable)
          if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
            sudo sed -i '/http\s*{/a \\tclient_max_body_size 100M;' /etc/nginx/nginx.conf
            echo "Added client_max_body_size to nginx.conf globally"
          else
            echo "client_max_body_size already in nginx.conf"
          fi
          
          # Copy our site config to ALL possible locations
          sudo cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar 2>/dev/null || true
          sudo ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar 2>/dev/null || true
          
          # Also overwrite default if it exists and contains our site
          if [ -f /etc/nginx/sites-enabled/default ]; then
            if grep -q "academypulaar\|173.249.2.195" /etc/nginx/sites-enabled/default 2>/dev/null; then
              sudo cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-enabled/default
              echo "Replaced default with our config"
            else
              # Default exists but is not our site - remove it to avoid conflicts
              sudo rm -f /etc/nginx/sites-enabled/default
              echo "Removed default config to avoid conflicts"
            fi
          fi
          
          # Also handle conf.d directory
          if [ -d /etc/nginx/conf.d ]; then
            for f in /etc/nginx/conf.d/*.conf; do
              if [ -f "$f" ] && grep -q "academypulaar\|173.249.2.195" "$f" 2>/dev/null; then
                sudo cp /var/www/academypulaar/nginx-academypulaar.conf "$f"
                echo "Updated $f"
              fi
            done
          fi
          
          echo "--- Nginx config test ---"
          sudo nginx -t
          echo "--- Active server blocks ---"
          sudo grep -r "server_name\|client_max_body_size" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null || true

      - name: Reload Nginx
        run: sudo systemctl reload nginx

      - name: Verify deployment
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
          echo ""
          echo "Deployment complete!"
