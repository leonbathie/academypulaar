name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git pull origin main

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          sudo /usr/lib/node_modules/pm2/bin/pm2 restart academypulaar-api || sudo /usr/lib/node_modules/pm2/bin/pm2 start server.js --name academypulaar-api

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Create fix script with LF endings
          cat > /tmp/fix-nginx.sh << 'ENDSCRIPT'
#!/bin/bash
set -e
echo "Fixing Nginx config..."

# Add client_max_body_size globally
sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
sed -i '/http {/a\    client_max_body_size 100M;' /etc/nginx/nginx.conf

# Remove default to avoid conflicting server names
rm -f /etc/nginx/sites-enabled/default

# Copy site config (only ONE file to avoid duplicates)
cp /var/www/academypulaar/nginx-academypulaar.conf /etc/nginx/sites-available/academypulaar
ln -sf /etc/nginx/sites-available/academypulaar /etc/nginx/sites-enabled/academypulaar

nginx -t && systemctl reload nginx
echo "Nginx fixed successfully!"
ENDSCRIPT
          chmod +x /tmp/fix-nginx.sh
          
          # gha has no passwordless sudo, use PM2 which runs as root
          sudo /usr/lib/node_modules/pm2/bin/pm2 delete nginx-fix 2>/dev/null || true
          sudo /usr/lib/node_modules/pm2/bin/pm2 start /tmp/fix-nginx.sh --name nginx-fix --interpreter bash --no-autorestart 2>&1 || true
          sleep 10
          # Show logs (--nostream avoids tailing forever)
          sudo /usr/lib/node_modules/pm2/bin/pm2 logs nginx-fix --lines 50 --nostream 2>&1 || true
          sudo /usr/lib/node_modules/pm2/bin/pm2 delete nginx-fix 2>&1 || true

      - name: Reload Nginx
        continue-on-error: true
        run: sudo /usr/lib/node_modules/pm2/bin/pm2 delete nginx-fix 2>/dev/null; echo "Done"

      - name: Verify deployment
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
          echo ""
          echo "Deployment complete!"
