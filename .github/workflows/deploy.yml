name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/academypulaar
          git pull origin main

      - name: Install backend dependencies
        run: |
          cd /var/www/academypulaar/backend
          npm install --production

      - name: Run database migrations
        run: |
          cd /var/www/academypulaar/backend
          node init-database.js

      - name: Restart backend (PM2)
        run: |
          cd /var/www/academypulaar/backend
          sudo /usr/lib/node_modules/pm2/bin/pm2 restart academypulaar-api || sudo /usr/lib/node_modules/pm2/bin/pm2 start server.js --name academypulaar-api

      - name: Install frontend dependencies
        run: |
          cd /var/www/academypulaar/academie-react
          npm install

      - name: Build frontend
        run: |
          cd /var/www/academypulaar/academie-react
          npm run build

      - name: Update Nginx config
        continue-on-error: true
        run: |
          # Method 1: Try sudo bash script
          sudo bash /var/www/academypulaar/backend/scripts/fix-nginx.sh 2>&1 || echo "Method 1 failed"
          
          # Method 2: Try sudo tee to write config directly
          sudo tee /etc/nginx/sites-enabled/academypulaar < /var/www/academypulaar/nginx-academypulaar.conf > /dev/null 2>&1 || echo "Method 2 failed"
          
          # Method 3: Try adding client_max_body_size to nginx.conf via sudo tee
          grep -q "client_max_body_size" /etc/nginx/nginx.conf 2>/dev/null || {
            sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak 2>/dev/null
            sudo awk '/http[[:space:]]*\{/{print; print "    client_max_body_size 100M;"; next}1' /etc/nginx/nginx.conf.bak | sudo tee /etc/nginx/nginx.conf > /dev/null 2>&1 || echo "Method 3 failed"
          }
          
          sudo nginx -t 2>&1 || echo "Nginx test failed"

      - name: Reload Nginx
        continue-on-error: true
        run: sudo systemctl reload nginx

      - name: Verify deployment
        run: |
          sleep 2
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
          echo ""
          echo "Deployment complete!"
