<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A537;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circular Frame -->
  <circle cx="100" cy="100" r="98" stroke="#D4A537" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Portrait Container -->
  <g transform="translate(40, 25)">
    <!-- Face/Profile Outline -->
    <path d="M60 140 C50 140 40 130 40 110 C40 90 50 80 60 75 Q80 70 95 85 C110 100 110 120 100 135 C95 145 80 145 60 140Z" fill="#D4A537" fill-opacity="0.1"/>
    <path d="M60 140 C50 140 40 130 40 110 C40 90 45 85 50 80" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Chin and Neck -->
    <path d="M100 135 C115 120 115 100 105 85" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/> <!-- Back of head -->
    
    <!-- Traditional Fulani Hat (Tengaade) -->
    <!-- Base cone -->
    <path d="M15 85 L105 85 L60 10 Z" fill="url(#hatGrad)" fill-opacity="0.2" stroke="#D4A537" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Decorative Zigzag Pattern -->
    <path d="M30 65 L40 55 L50 65 L60 55 L70 65 L80 55 L90 65" stroke="#D4A537" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M35 75 L45 65 L55 75 L65 65 L75 75 L85 65 L95 75" stroke="#D4A537" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Top Knob -->
    <circle cx="60" cy="10" r="6" fill="#D4A537"/>
    <path d="M54 10 Q60 2 66 10" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    
    <!-- Side Tassels / Buttons -->
    <circle cx="28" cy="78" r="4" fill="#D4A537"/>
    <circle cx="92" cy="78" r="4" fill="#D4A537"/>
    
    <!-- Hat Chin Strap -->
    <path d="M45 85 Q60 120 75 85" stroke="#D4A537" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

    <!-- Eye Detail (Simple illustrative line) -->
    <path d="M85 100 Q92 98 95 105" stroke="#D4A537" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Shoulders / Boubou Detail -->
    <path d="M10 145 Q60 135 110 145" stroke="#D4A537" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M20 145 V160 M100 145 V160" stroke="#D4A537" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Bottom Label Space (Implicit) -->
  <path d="M60 185 H140" stroke="#D4A537" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.5"/>
</svg>
