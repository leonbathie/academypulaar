<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .gold { fill: #D4A537; }
      .gold-stroke { stroke: #D4A537; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .sketch { stroke: #D4A537; fill: none; stroke-width: 0.5; opacity: 0.4; }
    </style>
  </defs>

  <!-- Circle Frame -->
  <circle cx="100" cy="100" r="95" class="gold-stroke" style="stroke-width: 1.5; opacity: 0.8;"/>
  <circle cx="100" cy="100" r="90" class="gold-stroke" style="stroke-width: 0.5; opacity: 0.4;"/>

  <!-- Cow (Zébu) Illustration -->
  <g transform="translate(80, 70)">
    <!-- Body -->
    <path d="M10 50 Q25 40 50 45 Q70 50 80 70 V100 H70 V85 H30 V100 H20 V75 Q10 70 10 50Z" class="gold" opacity="0.1"/>
    <path d="M10 50 Q25 40 50 45 Q70 50 80 70 V100 M70 100 V85 H30 V100 M20 100 V75 Q10 70 10 50" class="gold-stroke"/>
    
    <!-- Hump -->
    <path d="M35 44 C45 25 60 30 65 47" class="gold-stroke" style="stroke-width: 3;"/>
    <!-- Sketch lines on hump -->
    <path d="M42 35 L48 38 M45 32 L51 35" class="sketch"/>

    <!-- Head -->
    <path d="M80 70 L95 65 Q100 75 95 85 L80 85 Z" class="gold" opacity="0.2"/>
    <path d="M80 70 L95 65 Q100 75 95 85 L80 85" class="gold-stroke"/>
    
    <!-- Horns -->
    <path d="M92 67 C105 45 125 40 135 35" class="gold-stroke" style="stroke-width: 2.5;"/>
    <path d="M96 67 C90 45 80 40 70 35" class="gold-stroke" style="stroke-width: 2.5;"/>
    
    <!-- Details -->
    <circle cx="90" cy="74" r="1.5" class="gold"/> <!-- Eye -->
    <path d="M10 55 C0 65 5 95 8 100" class="gold-stroke" style="stroke-width: 1;"/> <!-- Tail -->
  </g>

  <!-- Shepherd (Pullo) Illustration -->
  <g transform="translate(30, 60)">
    <!-- Hat (Tengaade) -->
    <path d="M10 30 L40 30 L25 5 Z" class="gold"/>
    <path d="M15 30 L25 10 L35 30" class="sketch" style="stroke: #FFFFFF; opacity: 0.6;"/>
    
    <!-- Body (Boubou) -->
    <path d="M12 30 L38 30 L45 120 L5 120 Z" class="gold" opacity="0.15"/>
    <path d="M12 30 L38 30 L45 120 H5 L12 30" class="gold-stroke"/>
    
    <!-- Face -->
    <circle cx="25" cy="45" r="9" class="gold-stroke" style="stroke-width: 1.5;"/>
    <path d="M22 45 Q25 48 28 45" class="gold-stroke" style="stroke-width: 1;"/> <!-- Mouth -->

    <!-- Stick (Gafal) -->
    <path d="M45 15 V135" class="gold-stroke" style="stroke-width: 3.5;"/>
    <path d="M45 15 Q55 15 55 25" class="gold-stroke" style="stroke-width: 3.5;"/>
    
    <!-- Arm -->
    <path d="M35 70 L43 70" class="gold-stroke" style="stroke-width: 4;"/>
  </g>

  <!-- Ground -->
  <path d="M30 180 H170" class="sketch"/>
  <path d="M40 183 H160" class="sketch" style="opacity: 0.2;"/>
</svg>
