<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A537;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Decorative Background (Subtle) -->
  <circle cx="100" cy="100" r="90" stroke="#D4A537" stroke-width="0.5" fill="none" opacity="0.2"/>
  
  <!-- Dynamic Zebu Cow Logo -->
  <g transform="translate(20, 40) scale(1.4)">
    <!-- Main Body Shape - Sleek and Forward-Leaning -->
    <path d="M10 60 C10 40 25 30 50 32 C75 35 90 55 110 60 L125 75 L110 90 L90 90 Q85 105 80 120 H65 Q70 100 75 80 L40 80 Q35 100 30 120 H15 Q20 90 25 65 C15 65 10 75 10 60Z" fill="url(#goldGrad)" fill-opacity="0.1"/>
    
    <!-- Dynamic Outline -->
    <path d="M15 65 Q25 40 50 35 Q75 30 95 60 L120 75 L105 85" stroke="#D4A537" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    
    <!-- Hump - Dynamic Curve -->
    <path d="M30 35 C45 15 65 18 75 38" stroke="#D4A537" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Back Horn - Flowing backwards -->
    <path d="M95 55 C110 30 135 25 145 20" stroke="#D4A537" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Face/Nuzzle Detail -->
    <path d="M120 75 L105 85" stroke="#D4A537" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Legs in Motion (Simplified for Dynamic Look) -->
    <path d="M75 85 L68 115" stroke="#D4A537" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M35 85 L28 115" stroke="#D4A537" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Tail - Whipping through air -->
    <path d="M10 60 Q-10 70 5 95" stroke="#D4A537" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Grounding Line (Motion Stroke) -->
    <path d="M30 125 H100" stroke="#D4A537" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  </g>
</svg>
