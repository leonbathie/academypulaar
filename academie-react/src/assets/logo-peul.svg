<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Style definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A537;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Decorative Circle Frame (Minimalist) -->
  <circle cx="100" cy="100" r="95" stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Cow (Zébu) - Positioned behind and to the right -->
  <g id="cow" transform="translate(85, 80) scale(1.1)">
    <!-- Body -->
    <path d="M10 40 C20 30 50 30 70 45 C85 60 85 85 85 85 L70 85 L70 75 L30 75 L30 85 L15 85 C10 85 5 70 5 40Z" fill="url(#goldGrad)" fill-opacity="0.15" stroke="#D4A537" stroke-width="2"/>
    <!-- The Iconic Hump -->
    <path d="M18 40 C35 20 55 20 65 42" stroke="#D4A537" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Head and Ears -->
    <path d="M80 50 L95 45 L98 65 L82 65 Z" fill="#D4A537"/>
    <path d="M82 52 L75 55" stroke="#D4A537" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Majestic Horns -->
    <path d="M92 48 C100 30 115 25 120 20" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M95 48 C85 30 75 25 70 20" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Tail -->
    <path d="M10 45 C0 55 5 75 8 80" stroke="#D4A537" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Shepherd (Pullo) - Positioned in front and to the left -->
  <g id="shepherd" transform="translate(35, 45) scale(1.1)">
    <!-- Turban / Traditional Hat -->
    <path d="M10 25 L40 25 L25 10 Z" fill="#D4A537"/>
    <path d="M12 25 Q25 30 38 25" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
    <!-- Face Silhouette -->
    <circle cx="25" cy="38" r="8" stroke="#D4A537" stroke-width="2" fill="none"/>
    <!-- Boubou (Traditional Robe) -->
    <path d="M8 50 L42 50 L48 110 L2 110 Z" fill="url(#goldGrad)" fill-opacity="0.2" stroke="#D4A537" stroke-width="2"/>
    <path d="M25 50 V75" stroke="#D4A537" stroke-width="1" opacity="0.5"/>
    <path d="M15 65 H35" stroke="#D4A537" stroke-width="0.5" opacity="0.3"/>
    <!-- Arms holding the stick -->
    <path d="M35 65 L55 55" stroke="#D4A537" stroke-width="4" stroke-linecap="round"/>
    <!-- The Shepherd's Stick (Gafal) -->
    <path d="M58 10 V125" stroke="#D4A537" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 10 C58 0 75 0 75 10" stroke="#D4A537" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Symbolic GroundLine -->
  <path d="M30 175 Q100 185 170 175" stroke="#D4A537" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
</svg>
