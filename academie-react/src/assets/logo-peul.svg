<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle de bordure -->
  <circle cx="50" cy="50" r="48" stroke="#D4A537" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Silhouette détaillée de la Vache (Zébu) -->
  <g transform="translate(45, 45) scale(0.65)">
    <!-- Corps -->
    <path d="M10 40 Q25 35 45 38 Q65 40 70 55 V75 H60 V65 H30 V75 H20 V60 Q10 55 10 40Z" fill="#D4A537"/>
    <!-- Bosse du Zébu -->
    <path d="M35 38 Q45 25 55 38" stroke="#D4A537" stroke-width="4" stroke-linecap="round"/>
    <!-- Tête -->
    <path d="M70 55 L82 50 L85 65 L70 65Z" fill="#D4A537"/>
    <!-- Cornes -->
    <path d="M78 52 Q82 35 90 30" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M82 52 Q78 35 70 30" stroke="#D4A537" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Queue -->
    <path d="M10 45 Q5 55 8 65" stroke="#D4A537" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Silhouette détaillée du Berger Peul -->
  <g transform="translate(15, 30) scale(0.85)">
    <!-- Tête avec turban -->
    <circle cx="20" cy="12" r="7" fill="#D4A537"/>
    <path d="M13 10 Q20 5 27 10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Corps (Boubou) -->
    <path d="M10 20 L30 20 L35 65 H5 L10 20Z" fill="#D4A537"/>
    <path d="M20 20 V35" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    
    <!-- Bras tenant le bâton -->
    <path d="M30 35 L45 42" stroke="#D4A537" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Le bâton (Gafal) -->
    <path d="M48 10 V75" stroke="#D4A537" stroke-width="2" stroke-linecap="round"/>
    <path d="M48 10 Q55 10 55 18" stroke="#D4A537" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Sol symbolique -->
  <path d="M20 85 H80" stroke="#D4A537" stroke-width="0.5" stroke-dasharray="1 3"/>
</svg>
