  <body>
    <div id="root">
      <!-- Ecran de chargement statique : visible instantanement (avant meme le
           telechargement de React/i18n). React remplace tout #root au montage. -->
      <div id="boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fdf8f0">
        <div style="width:48px;height:48px;border:4px solid rgba(201,162,39,.25);border-top-color:#c9a227;border-radius:50%;animation:bootspin .8s linear infinite"></div>
      </div>
      <style>@keyframes bootspin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){#boot-loader{background:#141021!important}}</style>
    </div>
    <!-- Auto-recuperation apres deploiement : si un chunk JS hashe (route ou
         langue) est introuvable — typiquement quand un ancien onglet/bfcache
         reference des fichiers supprimes par un nouveau deploiement — on
         recharge la page pour recuperer le index.html frais et les bons chunks.
         Enregistre AVANT les modules pour attraper aussi l'echec du chunk de
         langue charge au demarrage. Garde-fou anti-boucle (1 rechargement/10s). -->
    <script>
      (function () {
        function recover() {
          try {
            var k = 'chunkReloadAt';
            var last = +(sessionStorage.getItem(k) || 0);
            if (Date.now() - last < 10000) return;
            sessionStorage.setItem(k, Date.now());
          } catch (e) { /* sessionStorage indispo : on recharge quand meme */ }
          window.location.reload();
        }
        window.addEventListener('vite:preloadError', recover);
        window.addEventListener('unhandledrejection', function (e) {
          var m = e && e.reason && (e.reason.message || String(e.reason));
          if (m && /dynamically imported module|importing a module script|Failed to fetch/i.test(m)) {
            recover();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
